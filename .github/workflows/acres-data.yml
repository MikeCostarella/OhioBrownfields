# Refresh the brownfield sites (react-app/src/data/sites.json) from EPA's ACRES
# layer, then commit and redeploy. fetch-acres.mjs leaves the file untouched
# when EPA's list hasn't changed, so most runs commit nothing, and it refuses a
# sudden drop of more than a fifth (a partial answer from the service).
# NOTE: like deploy.yml, this file must live at the REPO ROOT under
# .github/workflows/.

name: Refresh brownfield sites

on:
  schedule:
    - cron: "47 13 15 * *" # 13:47 UTC on the 15th of every month
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to kick deploy.yml after the bot commit (bot pushes don't trigger `on: push`)

concurrency:
  group: acres-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch EPA ACRES sites
        working-directory: react-app
        run: node scripts/fetch-acres.mjs

      - name: Commit if changed
        id: commit
        run: |
          git add react-app/src/data/sites.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in EPA's list."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh EPA ACRES brownfield sites"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
